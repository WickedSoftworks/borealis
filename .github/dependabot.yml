version: 2

updates:
  # Application dependencies. Grouped so a week's worth of minor and patch
  # bumps arrives as one pull request CI can check at once, rather than twenty.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Prisma's CLI, client, and adapters must move together, and a major
    # version needs both migration histories regenerated by hand.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # The base image. A security fix in Alpine or Node should not wait for
  # someone to remember to rebuild.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
